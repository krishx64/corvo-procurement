services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corvo
      POSTGRES_PASSWORD: corvo
      POSTGRES_DB: corvo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvo -d corvo"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build: ./web
    environment:
      DATABASE_URL: postgres://corvo:corvo@db:5432/corvo
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
